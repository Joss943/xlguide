name: Site GitHub Pages

# Construit le site (page d'accueil + application web) et le publie sur la branche gh-pages.
# Aucune dépendance npm installée ici : seuls Node et les fichiers du dépôt servent à la construction.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pousser la branche gh-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: node tests/run.js
      - name: Scripts d'installation publiés (shellcheck, vérification SHA-256)
        shell: bash
        run: |
          shellcheck site/install.sh
          bash tests/install-sh.test.sh
          pwsh -NoProfile -File tests/install-ps1.test.ps1
      - run: node scripts/build-site.js
      - name: Publier sur la branche gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site généré depuis ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
