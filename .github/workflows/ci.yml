name: CI

# Actions épinglées par empreinte de commit (et non par étiquette, qui peut être déplacée) ;
# Dependabot (.github/dependabot.yml) propose leurs mises à jour.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (données, traducteur, recherche, sécurité)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tests/run.js
      # Vérification SHA-256 des scripts d'installation, sans réseau : tests/install-*.test.*
      - name: Scripts d'installation (shellcheck, vérification SHA-256)
        shell: bash
        run: |
          bash -n site/install.sh
          shellcheck site/install.sh tests/install-sh.test.sh
          bash tests/install-sh.test.sh
          pwsh -NoProfile -File tests/install-ps1.test.ps1

  installer-windows:
    name: Script d'installation Windows (PowerShell 5.1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Windows PowerShell 5.1 : celle qu'ouvre Windows 10/11 par défaut pour « irm … | iex »
      - shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install-ps1.test.ps1

  formulas:
    name: Résultats recalculés par LibreOffice
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Installer LibreOffice Calc
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libreoffice-calc python3-openpyxl
      - run: node tests/export-examples.js > "$RUNNER_TEMP/examples.json"
      - run: python3 tests/verify_libreoffice.py "$RUNNER_TEMP/examples.json"
