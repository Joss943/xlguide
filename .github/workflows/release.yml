name: Release

# Publication automatique : dès que la version de package.json change sur main
# (ex. « npm version patch --no-git-tag-version » puis push), les installateurs
# Windows et Linux sont compilés et la release GitHub vX.Y.Z est créée.
#
# Sécurité de la chaîne : jeton en lecture seule partout, sauf pour le job de publication ;
# la compilation (npm ci exécute du code de dépendances) n'a jamais de droit d'écriture ;
# actions épinglées par empreinte de commit ; sommes SHA-256 et attestation de provenance
# signée (Sigstore) publiées avec chaque release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  check:
    name: Nouvelle version ?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # La version sert dans des noms de fichiers et des commandes : format strict X.Y.Z
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version invalide : $VERSION"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release v$VERSION existe déjà : rien à publier."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version v$VERSION : compilation et publication."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tests/run.js

  linux:
    name: Linux (deb, rpm, pacman, AppImage)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Outils de paquetage
        run: sudo apt-get update -q && sudo apt-get install -y -q rpm libarchive-tools
      - run: npm ci
      - run: npx electron-builder --linux --x64 --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.AppImage

  windows:
    name: Windows (installateur .exe)
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          if-no-files-found: error
          path: dist/XLGuide-Setup.exe

  publish:
    name: Publication de la release
    needs: [check, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write      # créer la release
      id-token: write      # certificat Sigstore de l'attestation
      attestations: write  # enregistrer l'attestation
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Sommes de contrôle
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attestation de provenance (vérifiable avec « gh attestation verify »)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: 'out/*'
      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          ## Installer XLGuide v${VERSION}

          | Système | Fichier | Installation |
          |---|---|---|
          | **Windows 10/11** | \`XLGuide-Setup.exe\` | Double-clic (si SmartScreen s'affiche : *Informations complémentaires → Exécuter quand même*) |
          | **Ubuntu / Debian / Mint** | \`xlguide-amd64.deb\` | \`sudo apt install ./xlguide-amd64.deb\` |
          | **Fedora / RHEL** | \`xlguide-x86_64.rpm\` | \`sudo dnf install ./xlguide-x86_64.rpm\` |
          | **Arch / Manjaro** | \`xlguide-x86_64.pacman\` | \`sudo pacman -U xlguide-x86_64.pacman\` |
          | **Autres Linux** | \`XLGuide-x86_64.AppImage\` | \`chmod +x XLGuide-x86_64.AppImage && ./XLGuide-x86_64.AppImage\` |

          Linux en une commande : \`curl -fsSL https://joss943.github.io/xlguide/install.sh | bash\` (vérifie la somme SHA-256 avant d'installer)

          ### Vérifier un fichier
          - Somme : \`sha256sum -c --ignore-missing SHA256SUMS.txt\` (Windows : \`Get-FileHash .\\XLGuide-Setup.exe\`)
          - Provenance : \`gh attestation verify <fichier> --repo Joss943/xlguide\`

          Version web (sans installation) : https://joss943.github.io/xlguide/app/
          NOTES
          gh release create "v${VERSION}" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "XLGuide v${VERSION}" --notes-file notes.md --latest
