name: Release

# Publication automatique : dès que la version de package.json change sur main
# (ex. « npm version patch --no-git-tag-version » puis push), les installateurs
# Windows et Linux sont compilés et la release GitHub vX.Y.Z est créée.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  check:
    name: Nouvelle version ?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "La release v$VERSION existe déjà : rien à publier."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Nouvelle version v$VERSION : compilation et publication."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/run.js

  linux:
    name: Linux (deb, rpm, pacman, AppImage)
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Outils de paquetage
        run: sudo apt-get update -q && sudo apt-get install -y -q rpm libarchive-tools
      - run: npm ci
      - run: npx electron-builder --linux --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pacman
            dist/*.AppImage

  windows:
    name: Windows (installateur .exe)
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: dist/XLGuide-Setup.exe

  publish:
    name: Publication de la release
    needs: [check, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Sommes de contrôle
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          ## Installer XLGuide v${VERSION}

          | Système | Fichier | Installation |
          |---|---|---|
          | **Windows 10/11** | \`XLGuide-Setup.exe\` | Double-clic (si SmartScreen s'affiche : *Informations complémentaires → Exécuter quand même*) |
          | **Ubuntu / Debian / Mint** | \`xlguide-amd64.deb\` | \`sudo apt install ./xlguide-amd64.deb\` |
          | **Fedora / RHEL** | \`xlguide-x86_64.rpm\` | \`sudo dnf install ./xlguide-x86_64.rpm\` |
          | **Arch / Manjaro** | \`xlguide-x86_64.pacman\` | \`sudo pacman -U xlguide-x86_64.pacman\` |
          | **Autres Linux** | \`XLGuide-x86_64.AppImage\` | \`chmod +x XLGuide-x86_64.AppImage && ./XLGuide-x86_64.AppImage\` |

          Linux en une commande : \`curl -fsSL https://joss943.github.io/xlguide/install.sh | bash\`

          Version web (sans installation) : https://joss943.github.io/xlguide/app/
          NOTES
          gh release create "v${VERSION}" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "XLGuide v${VERSION}" --notes-file notes.md --latest
