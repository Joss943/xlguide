<!doctype html>
<html lang="fr" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="description" content="XLGuide : toutes les formules Excel en français, expliquées avec des exemples, des recettes de comptabilité et d’administration système et réseau, et un traducteur FR ⇄ EN.">
  <meta name="theme-color" content="#1a7f4b">
  <title>XLGuide — Formules Excel en français</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" title="Accueil">
      <img src="icons/icon.svg" alt="" width="30" height="30">
      <span>XL<b>Guide</b></span>
    </a>
    <div class="searchbox">
      <i data-ic="search"></i>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Que veux-tu faire ? « additionner si », « TTC », « échéance fin de mois »…"
             aria-label="Rechercher une fonction, une recette ou une erreur">
      <kbd id="kbdHint">/</kbd>
    </div>
    <div class="tools">
      <label class="ver" title="Ta version d’Excel : les fonctions indisponibles sont signalées">
        <span>Excel</span>
        <select id="ver">
          <option value="365">365</option>
          <option value="2024">2024</option>
          <option value="2021">2021</option>
          <option value="2019">2019</option>
          <option value="2016">2016</option>
          <option value="2013">2013</option>
          <option value="2010">2010</option>
        </select>
      </label>
      <button id="theme" class="icon-btn" title="Thème clair / sombre" aria-label="Changer de thème">
        <i data-ic="moon"></i>
      </button>
      <a id="install" class="btn btn-accent" href="../#telecharger" hidden><i data-ic="download"></i>Installer l’appli</a>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist">
    <a href="#/" data-tab="home"><i data-ic="home"></i>Accueil</a>
    <a href="#/fn" data-tab="fn"><i data-ic="math-function"></i>Fonctions <small id="cFn"></small></a>
    <a href="#/rx" data-tab="rx"><i data-ic="receipt-tax"></i>Recettes compta <small id="cRx"></small></a>
    <a href="#/it" data-tab="it"><i data-ic="network"></i>Informatique &amp; réseau <small id="cIt"></small></a>
    <a href="#/tr" data-tab="tr"><i data-ic="arrows-left-right"></i>Traducteur FR ⇄ EN</a>
    <a href="#/err" data-tab="err"><i data-ic="alert-circle"></i>Erreurs</a>
    <a href="#/kb" data-tab="kb"><i data-ic="keyboard"></i>Raccourcis</a>
    <a href="#/fav" data-tab="fav"><i data-ic="star"></i>Favoris <small id="cFav"></small></a>
  </nav>

  <main class="layout" id="layout">
    <aside class="side" id="side"></aside>
    <section class="list" id="list" aria-live="polite"></section>
    <article class="detail" id="detail" tabindex="-1"></article>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="data/core.js"></script>
  <script src="data/fn-logique-recherche.js"></script>
  <script src="data/fn-math-stats.js"></script>
  <script src="data/fn-texte-date.js"></script>
  <script src="data/fn-finance-info.js"></script>
  <script src="data/recipes.js"></script>
  <script src="data/recipes-it.js"></script>
  <script src="data/misc.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/formula.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
